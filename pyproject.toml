[project]
name = "zahnerflow-runtime"
version = "2.3.7"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "python-socketio",
  "uvicorn",
  "pyserial",
  "pydantic",
  "zahner-analysis>=1.1.5",
  "thales-remote>=1.2.8",
  "aiosmtplib>=5.1.2",
  "tzdata>=2026.2",
]

[dependency-groups]
dev = [
  "pyinstaller",
  "pytest",
]

[project.scripts]
zahnerflow = "zahnerflow_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/zahnerflow_cli"]

# 固定基线锁文件所用镜像，避免不同终端配置重写全部下载地址。
[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
