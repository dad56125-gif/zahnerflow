<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZahnerFlow · 功能全景</title>
<style>
:root{color-scheme:light dark;--paper:#f6f8fa;--surface:#ffffff;--text:#202e3a;--quiet:#536674;--line:#ccd6dd;--blue:#286186;--accent:#e5f0f6;--muted:#edf1f4;--focus:#1563a0;--warn:#825616;--shadow:0 8px 32px #17304915;font-family:"Microsoft YaHei",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#151b21;--surface:#202932;--text:#e4eaf0;--quiet:#b1c0ca;--line:#4c5b65;--blue:#9ac7e2;--accent:#294354;--muted:#28343f;--focus:#87c6f2;--warn:#efc17c;--shadow:0 8px 32px #0006}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text)}button,input,a{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:8px 12px;cursor:pointer}button:hover{background:var(--accent)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}a{color:var(--blue);overflow-wrap:anywhere}button[aria-pressed=true]{background:var(--accent);border-color:var(--blue)}header{padding:22px 28px 12px;display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}h1{font-size:24px;font-weight:600;margin:0}header p{margin:5px 0;color:var(--quiet);font-size:13px}.meta{font-size:12px;color:var(--quiet);text-align:right}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 28px 14px}.searchbox{position:relative;flex:1;min-width:180px;max-width:340px}.searchbox input{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px}.matches{position:absolute;top:100%;left:0;right:0;z-index:4;max-height:340px;overflow:auto;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:7px}.matches:empty{display:none}.matches button{display:block;width:100%;text-align:left;border:0;border-radius:0}.matches small{display:block;color:var(--quiet);font-size:12px;margin-top:3px}.toggles{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toggles label{font-size:13px;display:flex;align-items:center;gap:5px}.zoom-control{display:flex;gap:6px;align-items:center;font-size:13px}.zoom-control input{width:90px;accent-color:var(--blue)}.workspace{position:relative;margin:0 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.map{height:calc(100vh - 212px);min-height:520px;max-height:980px;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--line) .6px,transparent .6px);background-size:24px 24px;cursor:grab}.map.dragging{cursor:grabbing}.map svg{width:100%;height:100%;display:block}.node{cursor:pointer;outline:none}.node rect{fill:var(--surface);stroke:var(--line);stroke-width:1}.node.module rect{fill:var(--surface)}.node.stage rect{fill:var(--accent);stroke:transparent}.node.internal rect{fill:var(--muted)}.node.selected rect,.node:focus-visible rect{stroke:var(--focus);stroke-width:2}.node.hit rect{fill:var(--accent);stroke:var(--blue)}.node text{fill:var(--text);font-size:16px;pointer-events:none}.node .small{font-size:14px;fill:var(--quiet)}.node .count{font-size:13px;fill:var(--quiet)}.node.stage .label{font-size:18px;font-weight:600}.node.feature .label{font-size:15px}.node.module .label{font-size:17px;font-weight:500}.edge{fill:none;stroke:var(--line);stroke-width:1.2}.flow{stroke:var(--blue);stroke-width:1.6}.relation{stroke:var(--blue);stroke-dasharray:5 4;stroke-width:1.3}.lane-label{fill:var(--quiet);font-size:15px}.arrow{fill:var(--blue)}.dim{opacity:.35}.detail{position:absolute;top:12px;right:12px;bottom:12px;width:340px;z-index:2;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:8px;padding:18px;overflow:auto}.detail[hidden]{display:none}.detail .close{float:right;padding:3px 8px}.detail h2{margin:3px 28px 14px 0;font-size:19px;font-weight:500;line-height:1.45}.detail h3{font-size:13px;font-weight:500;color:var(--quiet);margin:20px 0 6px}.detail p{font-size:14px;line-height:1.75;margin:7px 0;overflow-wrap:anywhere}.status-line{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}.status-line span{background:var(--muted);padding:4px 6px;border-radius:4px}.related{display:flex;flex-wrap:wrap;gap:6px}.related button{font-size:12px;padding:5px 7px}.detail details{font-size:12px;margin:18px 0}.detail summary{cursor:pointer;font-size:13px;color:var(--blue)}.detail ul{padding-left:18px;line-height:1.6}.detail li{margin-bottom:9px}.detail code{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.module-features button{display:block;width:100%;font-size:13px;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:9px 0}.hint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 28px;color:var(--quiet);font-size:12px}.hint .legend{display:flex;gap:14px}.swatch{display:inline-block;width:24px;border-top:2px solid var(--blue);vertical-align:middle;margin-right:5px}.swatch.relation{border-top-style:dashed}.note{padding:0 28px 20px;font-size:12px;color:var(--quiet)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.error{padding:24px;color:var(--warn)}
@media(max-width:760px){header{padding:18px 14px 8px}h1{font-size:21px}.meta{text-align:left}.toolbar{padding:8px 14px;gap:8px}.searchbox{max-width:none;flex-basis:100%}.workspace{margin:0 8px}.map{height:66vh;min-height:420px}.detail{position:relative;top:auto;right:auto;bottom:auto;width:auto;border:0;border-top:1px solid var(--line);border-radius:0;max-height:none;box-shadow:none}.hint,.note{padding-left:14px;padding-right:14px}.toggles{gap:8px}.toggles label{font-size:12px}.zoom-control input{width:70px}button{min-height:38px}}
@media(prefers-reduced-motion:no-preference){.detail{animation:enter .15s ease-out}@keyframes enter{from{transform:translateX(8px)}to{transform:translateX(0)}}}
</style></head><body>
<header><div><h1>ZahnerFlow · 功能全景</h1><p>从准备实验到查看报告，沿同一条流程展开现有能力。</p></div><div class="meta" id="meta"></div></header>
<div class="toolbar" aria-label="图形控制">
 <div class="searchbox"><label class="sr-only" for="search">搜索功能、节点或源码</label><input id="search" type="search" placeholder="搜索功能、节点、入口…" autocomplete="off"><div id="matches" class="matches" aria-label="搜索结果"></div></div>
 <div class="zoom-control"><button id="zoom-out" aria-label="缩小">−</button><label for="zoom" class="sr-only">缩放</label><input id="zoom" type="range" min="0.5" max="2" step="0.05" value="1"><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button></div>
 <button id="fit">总览</button><button id="collapse">收起模块</button>
 <div class="toggles"><label><input id="internal" type="checkbox">内部能力层</label><label><input id="relations" type="checkbox" checked>选中关联线</label></div>
</div>
<main class="workspace"><div id="map" class="map" aria-label="实验全流程功能网络图"><svg id="svg" role="img" aria-labelledby="graph-title graph-desc"><title id="graph-title">ZahnerFlow 当前主线功能图</title><desc id="graph-desc">四个实验阶段及贯穿流程的辅助能力。点击模块展开，点击能力查看用途、入口和验证证据；拖动空白区域平移。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0,0 L8,4 L0,8 Z"/></marker></defs><g id="world"></g></svg></div><aside class="detail" id="detail" aria-label="选中功能详情" hidden></aside></main>
<div class="hint"><span>拖动空白处平移 · 滚轮缩放 · 点击模块展开 · 点击能力查看详情</span><span class="legend"><span><i class="swatch"></i>实验阶段</span><span><i class="swatch relation"></i>选中关联</span></span><span id="count" aria-live="polite"></span></div>
<div class="note">基于当前 main 独立调查。源码确认、隔离接口和 UI 操作分别标注；真机未验证。内部层默认隐藏。<a href="README.md">调查报告</a> · <a href="graph.json">结构化数据</a> · <a href="coverage.json">覆盖清单</a></div>
<script>
const DATA=/*__GRAPH_DATA__*/;
(()=>{
 const $=id=>document.getElementById(id),map=$('map'),world=$('world'),detail=$('detail'),namespace='http://www.w3.org/2000/svg';
 const modules=new Map(DATA.modules.map(m=>[m.id,m])), features=new Map(),parents=new Map();DATA.modules.forEach(m=>m.features.forEach(f=>{features.set(f.id,f);parents.set(f.id,m.id)}));
 const expanded=new Set(),positions=new Map();let scale=1,tx=0,ty=0,selected=null,width=1280,height=900,drag=null,query='',lastNarrow=null;
 $('meta').textContent=`main · ${DATA.baseline.version} · ${DATA.baseline.date}  |  ${DATA.baseline.sha.slice(0,12)}`;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function svg(tag,attrs={},text){const e=document.createElementNS(namespace,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
 const measure=document.createElement('canvas').getContext('2d');
 function lines(s,max,maxlines=2){measure.font='16px "Microsoft YaHei",sans-serif';let out=[],line='';for(const c of String(s)){if(measure.measureText(line+c).width>max){if(out.length===maxlines-1){while(measure.measureText(line+'…').width>max)line=line.slice(0,-1);out.push(line+'…');return out;}out.push(line);line=c;}else line+=c;}if(line)out.push(line);return out;}
 function textAt(g,s,x,y,cls,max=242,n=1){lines(s,max,n).forEach((line,i)=>g.append(svg('text',{x,y:y+i*19,class:cls},line)));}
 function searchable(n){return [n.label,n.purpose,n.entry,n.id,...(n.sources||[]).map(s=>s.path)].join(' ').toLowerCase();}
 function match(n){return query&&searchable(n).includes(query);}
 function drawNode(n,x,y,w,h,kind,count=0){const g=svg('g',{transform:`translate(${x},${y})`,class:`node ${kind}${selected===n.id?' selected':''}${match(n)?' hit':''}${query&&!match(n)&&!(n.features||[]).some(match)?' dim':''}`,role:'button',tabindex:'0','data-node-id':n.id,'aria-label':n.label+(kind==='module'?`，${count} 项能力，${expanded.has(n.id)?'已展开':'已收起'}`:''),'aria-expanded':kind==='module'?expanded.has(n.id):undefined});g.append(svg('title',{},n.label));g.append(svg('rect',{width:w,height:h,rx:kind==='feature'?6:10}));
  textAt(g,n.label,16,kind==='feature'?23:27,'label',w-42,kind==='feature'?2:1);
  if(kind==='stage')textAt(g,n.purpose,16,51,'small',w-30);
  else if(kind==='module'||kind==='internal'){textAt(g,`${count} 项能力`,16,52,'small');g.append(svg('text',{x:w-27,y:44,class:'small'},expanded.has(n.id)?'−':'+'));}
  else if(kind==='feature'){const v=n.verification;const status=v?.ui?.length?'UI 入口实测':v?.api?.length?'隔离接口验证':'源码确认';if(lines(n.label,w-42,2).length===1)textAt(g,status,16,45,'count');}
  g.addEventListener('click',()=>choose(n.id,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.id,true);}});world.append(g);positions.set(n.id,{x,y,w,h});return g;
 }
 function edge(a,b,kind='edge'){const p=svg('path',{d:`M${a.x},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x},${b.y}`,class:kind,'marker-end':kind.includes('flow')?'url(#arrow)':''});world.insertBefore(p,world.firstChild);}
 function moduleAt(m,x,y){drawNode(m,x,y,280,70,m.stage==='internal'?'internal':'module',m.features.length);let end=y+70;
  if(expanded.has(m.id)){m.features.forEach((f,i)=>{const fy=y+88+i*65;drawNode(f,x+24,fy,256,58,'feature');edge({x:x+10,y:y+70},{x:x+24,y:fy+29});end=fy+58;});}
  return end;
 }
 function layout(){const box=map.getBoundingClientRect();const cols=box.width>=1120?4:box.width>=700?2:1;const gap=34,pad=24;world.replaceChildren();positions.clear();width=cols*314+pad*2;let y=20,stageBottom=0,previous=null;
  DATA.stages.forEach((stage,i)=>{const col=i%cols;if(col===0&&i>0)y=stageBottom+75;const x=pad+col*314;drawNode(stage,x,y,280,70,'stage');if(previous){const cur={x,y,w:280,h:70};if(col>0)edge({x:previous.x+280,y:previous.y+35},{x,y:y+35},'edge flow');else edge({x:previous.x+140,y:previous.y+70},{x:x+140,y},'edge flow');}previous={x,y};let my=y+102;DATA.modules.filter(m=>m.stage===stage.id).forEach(m=>{const end=moduleAt(m,x,my);edge({x:x+8,y:y+70},{x,y:my+35});my=end+20;});stageBottom=Math.max(stageBottom,my);});
  let base=stageBottom+38;world.append(svg('text',{x:pad,y:base,class:'lane-label'},'贯穿全流程 · 学习、通知、诊断与接入'));base+=20;let bottom=base;
  const support=DATA.modules.filter(m=>m.stage==='support');let rowY=base,rowBottom=base;support.forEach((m,i)=>{if(i%cols===0&&i){rowY=rowBottom+22;}const end=moduleAt(m,pad+(i%cols)*314,rowY);rowBottom=Math.max(rowBottom,end);bottom=Math.max(bottom,end);});
  if($('internal').checked){base=bottom+58;world.append(svg('text',{x:pad,y:base,class:'lane-label'},'内部能力 · 默认隐藏，仅描述当前实现'));rowY=base+20;rowBottom=rowY;DATA.modules.filter(m=>m.stage==='internal').forEach((m,i)=>{if(i%cols===0&&i)rowY=rowBottom+22;const end=moduleAt(m,pad+(i%cols)*314,rowY);rowBottom=Math.max(rowBottom,end);bottom=Math.max(bottom,end);});}
  height=bottom+24;drawRelations();transform();lastNarrow=cols;$('count').textContent=`${DATA.modules.filter(m=>m.stage!=='internal'||$('internal').checked).length} 个模块 · ${features.size} 项能力（含内部层）`;
 }
 function drawRelations(){world.querySelectorAll('.relation').forEach(e=>e.remove());if(!$('relations').checked||!selected)return;const owner=modules.get(selected)||modules.get(parents.get(selected));if(!owner)return;const a=positions.get(owner.id);if(!a)return;owner.related.forEach(id=>{const b=positions.get(id);if(!b)return;edge({x:a.x+a.w,y:a.y+35},{x:b.x,y:b.y+35},'edge relation');});}
 function transform(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);$('zoom').value=scale;$('zoom-value').textContent=Math.round(scale*100)+'%';}
 function fit(){layout();const b=map.getBoundingClientRect();scale=Math.max(.8,Math.min(1.12,(b.width-24)/width,(b.height-16)/height));tx=Math.max(8,(b.width-width*scale)/2);ty=8;transform();}
 function focus(id){const p=positions.get(id);if(!p)return;const b=map.getBoundingClientRect(),reserve=!detail.hidden&&b.width>760?352:0;tx=(b.width-reserve)/2-(p.x+p.w/2)*scale;ty=b.height/2-(p.y+p.h/2)*scale;transform();}
 function evidence(n){const v=n.verification;if(!v)return `<span>模块汇总 · 子能力分别验证</span><span>真机未验证</span>`;return `<span>源码已核对</span>${v.api.length?'<span>隔离接口验证</span>':''}${v.ui.length?'<span>UI 入口实测</span>':''}<span>真机未验证</span>`;}
 function detailFor(n){const isModule=modules.has(n.id),owner=isModule?n:modules.get(parents.get(n.id));const related=(isModule?n.related:n.related)||[];const sources=n.sources||[...new Map((n.features||[]).flatMap(f=>f.sources||[]).map(s=>[s.path+':'+s.line,s])).values()];
  detail.innerHTML=`<button class="close" aria-label="关闭详情">×</button><h2>${esc(n.label)}</h2><div class="status-line">${evidence(n)}</div><h3>用途</h3><p>${esc(n.purpose)}</p><h3>从哪里进入</h3><p>${esc(n.entry)}</p>${!isModule?`<h3>验证边界</h3><p>${esc(n.limits||'本轮未进行真机验证。')}</p>`:'<p>模块验证仅表示实际检查的入口或子能力，不代表全部工况已通过。</p>'}${related.length?`<h3>关联功能</h3><div class="related">${related.filter(id=>modules.has(id)).map(id=>`<button data-related="${esc(id)}">${esc(modules.get(id).label)}</button>`).join('')}</div>`:''}${isModule?`<h3>${n.features.length} 项能力</h3><div class="module-features">${n.features.map(f=>`<button data-feature="${esc(f.id)}">${esc(f.label)}</button>`).join('')}</div>`:''}<details><summary>源码与详细证据</summary><p>分析基线：<code>${esc(DATA.baseline.sha)}</code></p><ul>${sources.map(s=>`<li><a href="../../../${encodeURI(s.path)}" target="_blank" rel="noopener">${esc(s.path)}:${esc(s.line)}</a><br><code>${esc(s.symbol)}</code></li>`).join('')}</ul>${n.verification?`<p>接口记录：${esc(n.verification.api.join('、')||'无此项运行证据')}<br>UI 记录：${esc(n.verification.ui.join('、')||'无此项交互证据')}</p>`:''}<a href="verification.json">验证证据索引</a></details>`;
  detail.hidden=false;detail.querySelector('.close').onclick=()=>{detail.hidden=true;selected=null;layout();};detail.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related,false));detail.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>choose(b.dataset.feature,false));
 }
 function choose(id,toggle=false){const n=modules.get(id)||features.get(id)||DATA.stages.find(s=>s.id===id);if(!n)return;if(DATA.stages.some(s=>s.id===id)){const ms=DATA.modules.filter(m=>m.stage===id);const all=ms.every(m=>expanded.has(m.id));ms.forEach(m=>all?expanded.delete(m.id):expanded.add(m.id));layout();return;}
  const owner=modules.get(id)||modules.get(parents.get(id));if(owner.stage==='internal')$('internal').checked=true;selected=id;if(modules.has(id)&&toggle){expanded.has(id)?expanded.delete(id):expanded.add(id);}else expanded.add(owner.id);detailFor(n);layout();focus(id);$('matches').replaceChildren();
 }
 function zoomTo(next,cx,cy){next=Math.max(.5,Math.min(2,next));const b=map.getBoundingClientRect();cx??=b.width/2;cy??=b.height/2;tx=cx-(cx-tx)*next/scale;ty=cy-(cy-ty)*next/scale;scale=next;transform();}
 $('zoom').oninput=e=>zoomTo(Number(e.target.value));$('zoom-in').onclick=()=>zoomTo(scale+.15);$('zoom-out').onclick=()=>zoomTo(scale-.15);$('fit').onclick=()=>{detail.hidden=true;selected=null;fit();};$('collapse').onclick=()=>{expanded.clear();selected=null;detail.hidden=true;fit();};$('internal').onchange=()=>{layout();fit();};$('relations').onchange=drawRelations;
 $('search').oninput=e=>{query=e.target.value.trim().toLowerCase();layout();const result=[...modules.values(),...features.values()].filter(match);$('matches').replaceChildren();result.slice(0,20).forEach(n=>{const b=document.createElement('button');b.type='button';b.innerHTML=esc(n.label)+`<small>${esc(modules.has(n.id)?'模块':modules.get(parents.get(n.id)).label)}</small>`;b.onclick=()=>choose(n.id,false);$('matches').append(b);});if(query){const s=document.createElement('small');s.style.cssText='display:block;padding:8px 12px';s.textContent=result.length?`${result.length} 个匹配；显示前 20 个`:'没有匹配功能';$('matches').append(s);}};
 $('search').onkeydown=e=>{if(e.key==='Escape'){$('matches').replaceChildren();}if(e.key==='Enter'){$('matches').querySelector('button')?.click();}};
 map.addEventListener('wheel',e=>{e.preventDefault();const b=map.getBoundingClientRect();zoomTo(scale*(e.deltaY>0?.92:1.08),e.clientX-b.left,e.clientY-b.top);},{passive:false});
 map.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};map.setPointerCapture(e.pointerId);map.classList.add('dragging');$('matches').replaceChildren();});map.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform();});function end(){drag=null;map.classList.remove('dragging');}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);
 let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const b=map.getBoundingClientRect(),cols=b.width>=1120?4:b.width>=700?2:1;if(cols!==lastNarrow){layout();fit();}else transform();},80);}).observe(map);
 window.__featureNetwork={getState:()=>({selected,expanded:[...expanded],scale,tx,ty,internal:$('internal').checked,positions:Object.fromEntries(positions)}),data:DATA};fit();
})();
</script></body></html>
